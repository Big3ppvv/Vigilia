name: Verificar La última vigilia

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Sintaxis y archivo único al día
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: la-ultima-vigilia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar sintaxis y archivo autónomo
        working-directory: .
        run: npm run check

      - name: Comprobar objetos y sinergias
        run: node tools/objects-check.mjs

  noche:
    name: Una noche entera con cada personaje
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Comprobar habilidades y faroles
        run: npm run test:gameplay

      - name: Comprobar sonidos de habilidades y faroles
        run: node la-ultima-vigilia/tools/audio.mjs

      - name: Velar con el piloto automático
        run: node la-ultima-vigilia/tools/smoke.mjs

      - name: Comprobar combate, efectos y movimiento reducido sin conexión
        run: node la-ultima-vigilia/tools/combat-vfx.mjs

      - name: Comprobar las reglas del velatorio
        run: node la-ultima-vigilia/tools/vigil-check.mjs

      - name: Comprobar que el sonido no falla ni satura
        run: node la-ultima-vigilia/tools/audio-check.mjs

      - name: Recorrer la interfaz con teclado y ratón
        run: node la-ultima-vigilia/tools/ui-check.mjs
