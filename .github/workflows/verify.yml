name: Verificar La última vigilia

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Sintaxis y archivo único al día
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: la-ultima-vigilia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar la sintaxis
        run: for f in *.js build.mjs tools/*.mjs; do node --check "$f"; done

      - name: Comprobar que la-ultima-vigilia.html está al día
        run: |
          node build.mjs
          if ! git diff --quiet -- la-ultima-vigilia.html; then
            echo "::error file=la-ultima-vigilia/la-ultima-vigilia.html::No coincide con el código. Ejecuta 'node build.mjs' en la-ultima-vigilia/ y sube el resultado."
            exit 1
          fi

  noche:
    name: Una noche entera con cada personaje
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Velar con el piloto automático
        run: node la-ultima-vigilia/tools/smoke.mjs

      - name: Comprobar combate, efectos y movimiento reducido sin conexión
        run: node la-ultima-vigilia/tools/combat-vfx.mjs
