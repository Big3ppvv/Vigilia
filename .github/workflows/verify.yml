name: Verificar La última vigilia

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Sintaxis y archivo único al día
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: la-ultima-vigilia
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar sintaxis y archivo autónomo
        working-directory: .
        run: npm run check


  noche:
    name: Una noche entera con cada personaje
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Velar con el piloto automático
        run: node la-ultima-vigilia/tools/smoke.mjs

      - name: Comprobar combate, efectos y movimiento reducido sin conexión
        run: node la-ultima-vigilia/tools/combat-vfx.mjs

      - name: Comprobar habilidades, faroles, interfaz y mezcla de sonido
        run: |
          npm run test:gameplay
          npm run test:audio
