name: Verificar La última vigilia

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Sintaxis, datos y archivo único al día
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar sintaxis y archivo autónomo
        run: npm run check

      - name: Comprobar armas, objetos, personajes y equilibrio
        run: npm run test:data

  noche:
    name: Reglas, interfaz, sonido y una noche entera con cada personaje
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright y Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Comprobar las reglas de las rondas y la tienda
        run: npm run test:gameplay

      - name: Comprobar combate, efectos y movimiento reducido sin conexión
        run: npm run test:vfx

      - name: Comprobar que el sonido no falla ni satura
        run: npm run test:audio

      - name: Recorrer la interfaz con teclado, ratón y móvil
        run: npm run test:ui

      - name: Velar las dieciocho rondas con el piloto automático
        run: npm run test:night
